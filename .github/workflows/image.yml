name: Image

# Builds ghcr.io/noir017/talkcode — the gateway alone, for a container of its own (docs/docker.md)
# — from a published Release, for amd64 and arm64.
#
# Called by release.yml once the Release exists, and runnable by hand for a version already
# released (`gh workflow run image.yml -f version=X.Y.Z`). It is a separate workflow rather than
# a step of the release job because the release job runs on one architecture, and building the
# arm64 image under QEMU there would be slow; each architecture builds on its own native runner.
#
# The image installs the Release tarball, not this checkout (docker/Dockerfile says why), so the
# only things taken from the repository are the Dockerfile and its comments.

on:
  workflow_call:
    inputs:
      version:
        description: 'Released version to build (X.Y.Z)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to build (X.Y.Z)'
        required: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve the Release
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.sums.outputs.sha256 }}
      latest: ${{ steps.sums.outputs.latest }}
    steps:
      # The checksum is read from the Release's SHA256SUMS, never computed from a download: a
      # tarball swapped in transit would match a hash taken of itself.
      - name: Read SHA256SUMS
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir .
          sha="$(awk -v f="talkcode-${VERSION}.tgz" '{ sub(/^\.\//, "", $2) } $2 == f { print $1 }' SHA256SUMS)"
          if [ "${#sha}" != 64 ]; then
            echo "::error::no talkcode-${VERSION}.tgz line in the v${VERSION} SHA256SUMS"
            exit 1
          fi
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          # `latest` moves only to the newest Release. Rebuilding an older version by hand must
          # not roll every `docker compose pull` back to it.
          newest="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "latest=$([ "${newest}" = "v${VERSION}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          build-args: |
            TALKCODE_VERSION=${{ inputs.version }}
            TALKCODE_SHA256=${{ needs.resolve.outputs.sha256 }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and publish
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicit tags rather than metadata-action's event-based inference: under workflow_call and
      # workflow_dispatch that inference is hard to predict, and a `latest` that silently fails to
      # move is a deployment that silently does not update.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ needs.resolve.outputs.latest }}
        run: |
          tags=(-t "${IMAGE}:${VERSION}")
          if [ "${LATEST}" = true ]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ inputs.version }}"
