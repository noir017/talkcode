name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # talkcode-remote (remote/) is Go: its tests run here, and `npm run build` cross-compiles it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: remote/go.mod
          cache-dependency-path: remote/go.mod
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test + coverage
        run: npm run test:coverage
      - name: Test talkcode-remote
        run: npm run test:remote
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
